<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7fb"><title>Editor Undangan | VEXEL INVITATION</title>
<style>
:root{--p:#7357df;--bg:#f6f7fb;--line:#e8e9f0;--ink:#25263a;--muted:#85889a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}.brand{font-weight:850;letter-spacing:.5px;text-decoration:none;color:inherit}.brand span{color:var(--p)}.actions{display:flex;gap:8px;align-items:center}.btn{padding:10px 14px;border-radius:9px;background:#f0eff7;color:#555;font-weight:700}.primary{background:var(--p);color:white}.layout{display:grid;grid-template-columns:235px minmax(300px,1fr) 285px;gap:14px;padding:14px;max-width:1550px;margin:auto}.panel{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden;min-width:0}.head{padding:15px;font-weight:800;border-bottom:1px solid var(--line)}.sub{font-size:11px;color:var(--muted);font-weight:400;margin-top:4px}.list{padding:9px}.item{padding:10px;border-radius:9px;display:flex;gap:8px;align-items:center;cursor:grab;color:#626579;margin:2px 0}.item.active{background:#f0edff;color:#6049c9;font-weight:750}.item .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item.off{opacity:.5}.drag{color:#aaa;cursor:grab}.add{margin:8px 10px 12px;width:calc(100% - 20px);padding:11px;border:1px dashed #c9c0ef;background:#faf9ff;color:#654fd0;border-radius:9px;font-weight:750}.center{min-width:0}.toolbar{background:#fff;border:1px solid var(--line);padding:10px 13px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.canvas{background:#e9eaf0;border-radius:13px;padding:18px;min-height:700px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}.invite{width:390px;max-width:100%;background:#fff;min-height:700px;box-shadow:0 12px 35px #0002;text-align:center;transition:width .2s}.cover{min-height:490px;background-position:center;background-size:cover;background-color:#8b7180;background-image:linear-gradient(#33283b66,#33283b88),linear-gradient(140deg,#c4a3af,#635365);color:white;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:25px}.cover h1{font:42px Georgia;font-weight:400;line-height:1.2}.cover small{letter-spacing:3px}.block{padding:40px 24px}.block h2{font:28px Georgia;color:#795c6b}.block p{line-height:1.8;color:#777;white-space:pre-line}.photo{width:170px;height:190px;object-fit:cover;border-radius:100px;background:#eadde3;display:block;margin:0 auto 18px}.photo-placeholder{width:170px;height:190px;border-radius:100px;background:#eadde3;display:grid;place-items:center;color:#987e8b;margin:0 auto 18px}.detail{padding:18px;background:#faf4f6;border-radius:8px;margin-top:15px}.end{padding:38px 20px;background:#584653;color:#fff}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px}.gallery img{width:100%;height:130px;object-fit:cover;border-radius:7px}.gallery-placeholder{background:#eadde3;min-height:130px;display:grid;place-items:center;color:#987e8b;border-radius:7px}.settings{padding:15px}.design-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.color-field input{height:40px;padding:3px!important}.section-title{font-size:11px;font-weight:850;color:#6049c9;border-top:1px solid var(--line);padding-top:13px;margin:17px 0 10px}.preset-row{display:flex;gap:6px;flex-wrap:wrap}.preset{padding:7px 9px;border-radius:7px;background:#f1eff9;font-size:11px;font-weight:700;color:#5d4ac0}.field{margin-bottom:14px}.field label{display:block;font-size:11px;font-weight:750;color:#666b7d;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.field textarea{min-height:70px;resize:vertical}.hint{font-size:10px;color:var(--muted);line-height:1.5}.danger{background:#fff0f1;color:#c84b60;width:100%}.device{padding:7px 10px;border-radius:7px;background:#f0eff7}.device.active{background:#eae5ff;color:#6049c9}.upload{display:block;border:1px dashed #c9c0ef;border-radius:9px;padding:12px;text-align:center;color:#654fd0;background:#faf9ff;font-weight:700;cursor:pointer}.upload input{display:none}.thumb{width:100%;max-height:125px;object-fit:cover;border-radius:8px;margin-top:8px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#25243a;color:#fff;padding:11px 17px;border-radius:9px;display:none;z-index:10}.anim-fade-up{animation:fadeUp .8s both}.anim-fade-in{animation:fadeIn 1s both}.anim-zoom-in{animation:zoomIn .8s both}.anim-slide-left{animation:slideLeft .8s both}.anim-slide-right{animation:slideRight .8s both}@keyframes fadeUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes zoomIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}@keyframes slideLeft{from{opacity:0;transform:translateX(25px)}to{opacity:1;transform:none}}@keyframes slideRight{from{opacity:0;transform:translateX(-25px)}to{opacity:1;transform:none}}
@media(max-width:1000px){.layout{grid-template-columns:200px 1fr}.right{grid-column:1/-1}}@media(max-width:650px){.top{padding:0 10px;height:60px}.brand{font-size:12px}.actions{gap:5px}.actions .btn{font-size:11px;padding:9px}.layout{display:flex;flex-direction:column;padding:9px;gap:10px}.list{display:flex;overflow-x:auto;gap:5px}.item{white-space:nowrap;min-width:125px}.canvas{padding:8px;min-height:570px}.invite{width:100%}.right{order:3}.settings{padding:13px}}
</style></head><body>
<header class="top"><a class="brand" href="../">VEXEL <span>INVITATION</span></a><div class="actions"><span id="status" class="sub">Draft lokal</span><button class="btn" id="previewBtn">Preview</button><button class="btn primary" id="saveBtn">Simpan Draft</button></div></header>
<main class="layout"><aside class="panel"><div class="head">Komponen Undangan<div class="sub">Pilih, geser urutan, atau sembunyikan</div></div><div class="list" id="list"></div><button class="add" id="add">＋ Tambah Komponen</button></aside>
<section class="center"><div class="toolbar"><b>Live Preview</b><div><button class="device active" data-size="mobile">▯ HP</button> <button class="device" data-size="desktop">▭ Desktop</button></div></div><div class="canvas"><div class="invite" id="preview"></div></div></section>
<aside class="panel right"><div class="head">Pengaturan Komponen<div class="sub">Edit isi, aset, dan animasi</div></div><div class="settings" id="settings"><p class="hint">Pilih komponen di panel kiri.</p></div></aside></main><div class="toast" id="toast"></div>
<script>
const initial=[
{id:'cover',type:'cover',name:'Cover',title:'The Wedding Of',groom:'Aditya',bride:'Anindya',date:'12 · 12 · 2026',image:'',enabled:true,animation:'none'},
{id:'couple',type:'couple',name:'Mempelai',title:'Kedua Mempelai',text:'Dengan penuh rasa syukur, kami mengundang Anda untuk merayakan hari bahagia kami.',image:'',enabled:true,animation:'fade-up'},
{id:'event',type:'event',name:'Detail Acara',title:'Akad & Resepsi',text:'Sabtu, 12 Desember 2026',detail:'Akad: 09.00 WIB\nResepsi: 11.00 WIB',enabled:true,animation:'fade-up'},
{id:'location',type:'location',name:'Lokasi & Maps',title:'Lokasi Acara',text:'Gedung Serbaguna Jombang',detail:'Jl. Raya Jombang, Jawa Timur',maps:'https://maps.google.com',enabled:true,animation:'none'},
{id:'gift',type:'gift',name:'Amplop Digital',title:'Kirim Hadiah',text:'Doa restu Anda adalah hadiah terindah.',bank:'Bank BCA',account:'1234567890',owner:'Aditya',enabled:true,animation:'fade-up'},
{id:'closing',type:'closing',name:'Penutup',title:'Terima Kasih',text:'Merupakan kehormatan bagi kami atas kehadiran dan doa restu Anda.',enabled:true,animation:'fade-up'}
];
let data;try{data=JSON.parse(localStorage.getItem('vexel-editor-data')||'null')}catch(e){}if(!Array.isArray(data)||!data.length)data=initial;
data=data.map(x=>({enabled:true,animation:'none',...x}));
let selected=data[0]?.id||null,size='mobile',dragged=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function save(silent=false){try{localStorage.setItem('vexel-editor-data',JSON.stringify(data));$('status').textContent='● Tersimpan di perangkat';if(!silent)notify('Draft berhasil disimpan di perangkat ini')}catch(e){notify('Penyimpanan penuh. Coba gunakan foto berukuran lebih kecil.')}}
function list(){$('list').innerHTML=data.map(x=>'<div class="item '+(x.id===selected?'active ':'')+(x.enabled?'':'off')+'" draggable="true" data-id="'+esc(x.id)+'"><span class="drag">⠿</span><span class="label">'+esc(x.name)+'</span><span title="'+(x.enabled?'Sembunyikan':'Tampilkan')+'" class="toggle" data-toggle="'+esc(x.id)+'">'+(x.enabled?'◉':'○')+'</span></div>').join('');document.querySelectorAll('.item').forEach(el=>{el.onclick=e=>{if(e.target.dataset.toggle)return;selected=el.dataset.id;render()};el.ondragstart=()=>{dragged=el.dataset.id};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();let target=el.dataset.id;if(!dragged||dragged===target)return;let from=data.findIndex(x=>x.id===dragged),to=data.findIndex(x=>x.id===target),moved=data.splice(from,1)[0];data.splice(to,0,moved);dragged=null;render();save(true)}});document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=e=>{e.stopPropagation();let x=data.find(a=>a.id===el.dataset.toggle);x.enabled=!x.enabled;render();save(true)})}
function componentCss(x){return 'background-color:'+ (x.bgColor|| (x.type==='cover'?'#8b7180':x.type==='closing'?'#584653':'#ffffff'))+';color:'+(x.textColor||(x.type==='cover'||x.type==='closing'?'#ffffff':'#777777'))+';text-align:'+(x.align||'center')+';padding:'+(x.padding|| (x.type==='cover'? '45':'40'))+'px '+(x.sidePadding||24)+'px;border-radius:'+(x.radius||0)+'px;'}
function headingCss(x){return 'color:'+(x.titleColor|| (x.type==='closing'?'#ffffff':'#795c6b'))+';font-family:'+(x.fontFamily||'Georgia')+';font-size:'+(x.titleSize||28)+'px;'}
function bodyCss(x){return 'color:'+(x.textColor||(x.type==='cover'||x.type==='closing'?'#ffffff':'#777777'))+';font-family:'+(x.bodyFont||'Arial')+';font-size:'+(x.bodySize||14)+'px;'}
function sectionImage(x,alt){return x.image?'<img class="photo" src="'+x.image+'" alt="'+esc(alt)+'">':'<div class="photo-placeholder">＋ Foto '+esc(alt)+'</div>'}
function preview(){let out='';data.filter(x=>x.enabled).forEach(x=>{let a=x.animation&&x.animation!=='none'?' anim-'+x.animation:'';if(x.type==='cover')out+='<section class="cover'+a+'" style="'+componentCss(x)+';'+(x.image?'background-image:linear-gradient(#33283b66,#33283b88),url('+JSON.stringify(x.image)+');background-size:cover;background-position:center;':'')+'"><small style="'+headingCss(x)+'">'+esc(x.title)+'</small><h1 style="'+headingCss(x)+'">'+esc(x.groom||'Mempelai Pria')+'<br>&amp;<br>'+esc(x.bride||'Mempelai Wanita')+'</h1><p style="'+bodyCss(x)+'">'+esc(x.date)+'</p></section>';
else if(x.type==='couple')out+='<section class="block'+a+'" style="'+componentCss(x)+'">'+sectionImage(x,'Mempelai')+'<h2 style="'+headingCss(x)+'">'+esc(x.title)+'</h2><p style="'+bodyCss(x)+'">'+esc(x.text)+'</p></section>';
else if(x.type==='event'||x.type==='location')out+='<section class="block'+a+'" style="'+componentCss(x)+'"><h2 style="'+headingCss(x)+'">'+esc(x.title)+'</h2><div class="detail" style="border-radius:'+(x.radius||8)+'px;background:'+(x.cardColor||'#faf4f6')+'"><b>'+esc(x.text)+'</b><p>'+esc(x.detail)+'</p>'+(x.type==='location'&&x.maps?'<a href="'+esc(x.maps)+'" target="_blank" rel="noopener">Buka Google Maps ↗</a>':'')+'</div></section>';
else if(x.type==='gift')out+='<section class="block'+a+'" style="'+componentCss(x)+'"><h2 style="'+headingCss(x)+'">'+esc(x.title)+'</h2><p style="'+bodyCss(x)+'">'+esc(x.text)+'</p><div class="detail" style="background:'+(x.cardColor||'#faf4f6')+'"><b>'+esc(x.bank)+'</b><h2>'+esc(x.account)+'</h2><p>a.n. '+esc(x.owner)+'</p></div></section>';
else if(x.type==='gallery')out+='<section class="block'+a+'" style="'+componentCss(x)+'"><h2 style="'+headingCss(x)+'">'+esc(x.title)+'</h2><div class="gallery">'+(x.images||[]).map(src=>'<img src="'+src+'" alt="Foto galeri">').join('')+(x.images?.length?'':'<div class="gallery-placeholder">Galeri foto</div>')+'</div></section>';
else if(x.type==='story'||x.type==='rsvp')out+='<section class="block'+a+'" style="'+componentCss(x)+'"><h2 style="'+headingCss(x)+'">'+esc(x.title)+'</h2><p style="'+bodyCss(x)+'">'+esc(x.text)+'</p></section>';
else out+='<section class="end'+a+'" style="'+componentCss(x)+'"><h2 style="'+headingCss(x)+'">'+esc(x.title)+'</h2><p style="'+bodyCss(x)+'">'+esc(x.text)+'</p><h3>'+(esc(data.find(y=>y.type==='cover')?.groom||'')+' & '+esc(data.find(y=>y.type==='cover')?.bride||''))+'</h3></section>'});$('preview').innerHTML=out||'<div class="block">Belum ada komponen yang ditampilkan.</div>';$('preview').style.width=size==='desktop'?'100%':'390px'}
function field(label,key,val,type='text'){return '<div class="field"><label>'+label+'</label><input data-key="'+key+'" type="'+type+'" value="'+esc(val)+'"></div>'}
function area(label,key,val){return '<div class="field"><label>'+label+'</label><textarea data-key="'+key+'">'+esc(val)+'</textarea></div>'}
function uploadField(label,id,multiple=false){return '<div class="field"><label>'+label+'</label><label class="upload">＋ Pilih '+(multiple?'Foto-foto':'Foto')+'<input type="file" id="'+id+'" accept="image/*" '+(multiple?'multiple':'')+'></label></div>'}
function colorField(label,key,val){return '<div class="field color-field"><label>'+label+'</label><input type="color" data-key="'+key+'" value="'+esc(val)+'"></div>'}
function numberField(label,key,val,min,max){return '<div class="field"><label>'+label+'</label><input type="number" min="'+min+'" max="'+max+'" data-key="'+key+'" value="'+val+'"></div>'}
function settings(){let x=data.find(a=>a.id===selected);if(!x){$('settings').innerHTML='<p class="hint">Pilih komponen di panel kiri.</p>';return}
let h='<h4>'+esc(x.name)+'</h4>'+field('Nama komponen','name',x.name)+field('Judul','title',x.title);
if(x.type==='cover')h+=field('Nama mempelai pria','groom',x.groom)+field('Nama mempelai wanita','bride',x.bride)+field('Tanggal acara','date',x.date)+uploadField('Foto latar cover','coverUpload')+(x.image?'<img class="thumb" src="'+x.image+'">':'');
if(x.type==='couple')h+=area('Deskripsi mempelai','text',x.text)+uploadField('Foto mempelai','coupleUpload')+(x.image?'<img class="thumb" src="'+x.image+'">':'');
if(['event','location','gift','closing','story','rsvp'].includes(x.type))h+=area('Deskripsi / informasi','text',x.text);
if(x.type==='event'||x.type==='location')h+=area('Detail tambahan','detail',x.detail);
if(x.type==='location')h+=field('Tautan Google Maps','maps',x.maps,'url');
if(x.type==='gift')h+=field('Nama bank','bank',x.bank)+field('Nomor rekening','account',x.account)+field('Nama pemilik rekening','owner',x.owner);
if(x.type==='gallery')h+=uploadField('Foto galeri (bisa pilih beberapa)','galleryUpload',true)+'<p class="hint">'+(x.images?.length||0)+' foto ditambahkan.</p>';
h+='<div class="section-title">Desain Visual</div><div class="preset-row"><button type="button" class="preset" data-preset="classic">Classic</button><button type="button" class="preset" data-preset="blush">Blush</button><button type="button" class="preset" data-preset="sage">Sage</button><button type="button" class="preset" data-preset="midnight">Midnight</button></div><div class="design-grid">'+colorField('Warna latar','bgColor',x.bgColor|| (x.type==='cover'?'#8b7180':x.type==='closing'?'#584653':'#ffffff'))+colorField('Warna teks','textColor',x.textColor||'#777777')+colorField('Warna judul','titleColor',x.titleColor||(x.type==='cover'||x.type==='closing'?'#ffffff':'#795c6b'))+colorField('Warna kotak','cardColor',x.cardColor||'#faf4f6')+'</div><div class="field"><label>Jenis huruf judul</label><select data-key="fontFamily"><option>Georgia</option><option>Arial</option><option>Trebuchet MS</option><option>Times New Roman</option><option>Courier New</option></select></div><div class="field"><label>Jenis huruf isi</label><select data-key="bodyFont"><option>Arial</option><option>Georgia</option><option>Trebuchet MS</option><option>Times New Roman</option></select></div><div class="design-grid">'+numberField('Ukuran judul (px)','titleSize',x.titleSize||28,16,54)+numberField('Ukuran isi (px)','bodySize',x.bodySize||14,10,26)+numberField('Jarak atas/bawah (px)','padding',x.padding||40,8,100)+numberField('Jarak samping (px)','sidePadding',x.sidePadding||24,8,60)+numberField('Sudut kotak (px)','radius',x.radius||0,0,40)+'</div><div class="field"><label>Perataan konten</label><select data-key="align"><option value="center">Tengah</option><option value="left">Kiri</option><option value="right">Kanan</option></select></div>';
h+='<div class="field"><label>Animasi kemunculan (opsional)</label><select data-key="animation"><option value="none">Tanpa animasi</option><option value="fade-up">Fade Up</option><option value="fade-in">Fade In</option><option value="zoom-in">Zoom In</option><option value="slide-left">Slide Left</option><option value="slide-right">Slide Right</option></select></div><button class="btn danger" id="remove">Hapus komponen</button><p class="hint">Foto disimpan sementara di browser perangkat ini. Untuk penggunaan publik dan penyimpanan permanen, nanti kita sambungkan ke penyimpanan cloud.</p>';$('settings').innerHTML=h;$('settings').querySelector('[data-key=animation]').value=x.animation||'none';['fontFamily','bodyFont','align'].forEach(k=>{let el=$('settings').querySelector('[data-key='+k+']');if(el)el.value=x[k]|| (k==='fontFamily'?'Georgia':k==='bodyFont'?'Arial':'center')});
$('settings').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{x[el.dataset.key]=el.value;preview();if(el.dataset.key==='name')list();save(true)});
document.querySelectorAll('[data-preset]').forEach(btn=>btn.onclick=()=>{let themes={classic:{bgColor:'#fffaf3',textColor:'#75645c',titleColor:'#785846',cardColor:'#f5eadf',fontFamily:'Georgia'},blush:{bgColor:'#fff5f7',textColor:'#806b72',titleColor:'#a45f76',cardColor:'#f9e5eb',fontFamily:'Georgia'},sage:{bgColor:'#f4f7f1',textColor:'#596b5c',titleColor:'#526c56',cardColor:'#e8efe5',fontFamily:'Georgia'},midnight:{bgColor:'#242638',textColor:'#e9e8f0',titleColor:'#f1dba8',cardColor:'#37394f',fontFamily:'Times New Roman'}};Object.assign(x,themes[btn.dataset.preset]);render();save(true)});
function readFiles(files,callback){let arr=[...files];if(!arr.length)return;let results=[],done=0;arr.forEach((f,i)=>{if(!f.type.startsWith('image/'))return;let reader=new FileReader();reader.onload=()=>{results[i]=reader.result;if(++done===arr.length)callback(results.filter(Boolean))};reader.onerror=()=>{if(++done===arr.length)callback(results.filter(Boolean))};reader.readAsDataURL(f)})}
let cu=$('coverUpload'),co=$('coupleUpload'),ga=$('galleryUpload');if(cu)cu.onchange=e=>readFiles(e.target.files,imgs=>{x.image=imgs[0];render();save(true)});if(co)co.onchange=e=>readFiles(e.target.files,imgs=>{x.image=imgs[0];render();save(true)});if(ga)ga.onchange=e=>readFiles(e.target.files,imgs=>{x.images=[...(x.images||[]),...imgs];render();save(true)});$('remove').onclick=()=>{if(confirm('Hapus komponen ini?')){data=data.filter(a=>a.id!==x.id);selected=data[0]?.id||null;render();save(true)}}}
function render(){list();settings();preview()}
$('add').onclick=()=>{let opts=[['story','Cerita Cinta'],['gallery','Galeri Foto'],['rsvp','RSVP Kehadiran'],['event','Detail Acara'],['location','Lokasi & Maps'],['gift','Amplop Digital'],['closing','Penutup']];let n=prompt('Tambah komponen dengan nomor:\n'+opts.map((v,i)=>(i+1)+'. '+v[1]).join('\n'));if(!n||!opts[Number(n)-1])return;let [type,name]=opts[Number(n)-1],x={id:type+'-'+Date.now(),type,name,title:name,text:'Isi informasi di sini',detail:'',enabled:true,animation:'none'};data.push(x);selected=x.id;render();save(true)};
$('saveBtn').onclick=()=>save();$('previewBtn').onclick=()=>{let w=window.open('','_blank');if(!w){notify('Izinkan pop-up untuk membuka preview');return}let styles=[...document.querySelectorAll('style')].map(s=>s.innerHTML).join('');w.document.write('<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview Undangan</title><style>body{margin:0;background:#eee}.invite{max-width:520px;margin:auto;background:white;min-height:100vh;text-align:center}'+styles+'</style></head><body><div class="invite">'+$('preview').innerHTML+'</div></body></html>');w.document.close()};
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{size=b.dataset.size;document.querySelectorAll('[data-size]').forEach(z=>z.classList.toggle('active',z===b));preview()});render();
</script></body></html>
