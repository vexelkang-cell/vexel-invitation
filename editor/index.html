<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor Undangan | VEXEL INVITATION</title><style>
:root{--p:#7357df;--bg:#f6f7fb;--line:#e8e9f0;--ink:#25263a;--muted:#85889a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{font-weight:850;letter-spacing:.5px}.brand span{color:var(--p)}.actions{display:flex;gap:8px;align-items:center}.btn{padding:10px 14px;border-radius:9px;background:#f0eff7;color:#555;font-weight:700}.primary{background:var(--p);color:white}.layout{display:grid;grid-template-columns:230px minmax(300px,1fr) 280px;gap:14px;padding:14px;max-width:1500px;margin:auto}.panel{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden}.head{padding:15px;font-weight:800;border-bottom:1px solid var(--line)}.sub{font-size:11px;color:var(--muted);font-weight:400;margin-top:4px}.list{padding:9px}.item{padding:11px;border-radius:9px;display:flex;gap:9px;align-items:center;cursor:pointer;color:#626579}.item.active{background:#f0edff;color:#6049c9;font-weight:750}.item span:nth-child(2){flex:1}.add{margin:8px 10px 12px;width:calc(100% - 20px);padding:11px;border:1px dashed #c9c0ef;background:#faf9ff;color:#654fd0;border-radius:9px;font-weight:750}.center{min-width:0}.toolbar{background:#fff;border:1px solid var(--line);padding:10px 13px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.canvas{background:#e9eaf0;border-radius:13px;padding:18px;min-height:700px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}.invite{width:390px;max-width:100%;background:#fff;min-height:700px;box-shadow:0 12px 35px #0002;text-align:center}.cover{height:490px;background:linear-gradient(#33283b66,#33283b88),linear-gradient(140deg,#c4a3af,#635365);color:white;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:25px}.cover h1{font:42px Georgia;font-weight:400;line-height:1.2}.cover small{letter-spacing:3px}.block{padding:40px 24px}.block h2{font:28px Georgia;color:#795c6b}.block p{line-height:1.8;color:#777;white-space:pre-line}.photo{height:160px;background:#eadde3;border-radius:8px;display:grid;place-items:center;color:#987e8b}.detail{padding:18px;background:#faf4f6;border-radius:8px;margin-top:15px}.end{padding:38px 20px;background:#584653;color:#fff}.settings{padding:15px}.field{margin-bottom:14px}.field label{display:block;font-size:11px;font-weight:750;color:#666b7d;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.field textarea{min-height:70px}.hint{font-size:10px;color:var(--muted);line-height:1.5}.danger{background:#fff0f1;color:#c84b60;width:100%}.device{padding:7px 10px;border-radius:7px;background:#f0eff7}.device.active{background:#eae5ff;color:#6049c9}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#25243a;color:#fff;padding:11px 17px;border-radius:9px;display:none}
@media(max-width:950px){.layout{grid-template-columns:200px 1fr}.right{grid-column:1/-1}}@media(max-width:650px){.top{padding:0 11px}.layout{display:flex;flex-direction:column;padding:9px}.list{display:flex;overflow:auto;gap:5px}.item{white-space:nowrap}.canvas{padding:8px;min-height:580px}.invite{width:100%}.right{order:3}}
</style></head><body>
<header class="top"><a class="brand" href="../" style="text-decoration:none;color:inherit">VEXEL <span>INVITATION</span></a><div class="actions"><span id="status" class="sub">Draft lokal</span><button class="btn" id="previewBtn">Preview</button><button class="btn primary" id="saveBtn">Simpan Draft</button></div></header>
<main class="layout"><aside class="panel"><div class="head">Komponen Undangan<div class="sub">Pilih bagian untuk diedit</div></div><div class="list" id="list"></div><button class="add" id="add">＋ Tambah Komponen</button></aside>
<section class="center"><div class="toolbar"><b>Live Preview</b><div><button class="device active" data-size="mobile">▯ HP</button> <button class="device" data-size="desktop">▭ Desktop</button></div></div><div class="canvas"><div class="invite" id="preview"></div></div></section>
<aside class="panel right"><div class="head">Pengaturan Komponen<div class="sub">Edit isi dan tampilan</div></div><div class="settings" id="settings"><p class="hint">Pilih komponen di panel kiri.</p></div></aside></main><div class="toast" id="toast"></div>
<script>
const initial=[{id:'cover',type:'cover',name:'Cover',title:'The Wedding Of',groom:'Aditya',bride:'Anindya',date:'12 · 12 · 2026',animation:'none'},{id:'couple',type:'couple',name:'Mempelai',title:'Kedua Mempelai',text:'Dengan penuh rasa syukur, kami mengundang Anda untuk merayakan hari bahagia kami.'},{id:'event',type:'event',name:'Detail Acara',title:'Akad & Resepsi',text:'Sabtu, 12 Desember 2026',detail:'Akad: 09.00 WIB\nResepsi: 11.00 WIB'},{id:'location',type:'location',name:'Lokasi & Maps',title:'Lokasi Acara',text:'Gedung Serbaguna Jombang',detail:'Jl. Raya Jombang, Jawa Timur',maps:'https://maps.google.com'},{id:'gift',type:'gift',name:'Amplop Digital',title:'Kirim Hadiah',text:'Doa restu Anda adalah hadiah terindah.',bank:'Bank BCA',account:'1234567890',owner:'Aditya'},{id:'closing',type:'closing',name:'Penutup',title:'Terima Kasih',text:'Merupakan kehormatan bagi kami atas kehadiran dan doa restu Anda.'}];
let data=JSON.parse(localStorage.getItem('vexel-editor-data')||'null')||initial;let selected=data[0].id;let size='mobile';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2000)}
function save(){localStorage.setItem('vexel-editor-data',JSON.stringify(data));$('status').textContent='● Tersimpan';notify('Draft tersimpan di perangkat ini')}
function list(){ $('list').innerHTML=data.map(x=>'<div class="item '+(x.id===selected?'active':'')+'" data-id="'+x.id+'"><span>◇</span><span>'+esc(x.name)+'</span><span>⋮</span></div>').join('');document.querySelectorAll('.item').forEach(x=>x.onclick=()=>{selected=x.dataset.id;render()})}
function preview(){let out='';data.forEach(x=>{if(x.type==='cover')out+='<section class="cover"><small>'+esc(x.title)+'</small><h1>'+esc(x.groom)+'<br>&amp;<br>'+esc(x.bride)+'</h1><p>'+esc(x.date)+'</p></section>';else if(x.type==='couple')out+='<section class="block"><div class="photo">Foto Mempelai</div><h2>'+esc(x.title)+'</h2><p>'+esc(x.text)+'</p></section>';else if(x.type==='event'||x.type==='location')out+='<section class="block"><h2>'+esc(x.title)+'</h2><div class="detail"><b>'+esc(x.text)+'</b><p>'+esc(x.detail)+'</p>'+(x.maps?'<a href="'+esc(x.maps)+'" target="_blank">Buka Google Maps ↗</a>':'')+'</div></section>';else if(x.type==='gift')out+='<section class="block"><h2>'+esc(x.title)+'</h2><p>'+esc(x.text)+'</p><div class="detail"><b>'+esc(x.bank)+'</b><h2>'+esc(x.account)+'</h2><p>a.n. '+esc(x.owner)+'</p></div></section>';else out+='<section class="end"><h2>'+esc(x.title)+'</h2><p>'+esc(x.text)+'</p><h3>Aditya &amp; Anindya</h3></section>'});$('preview').innerHTML=out;$('preview').style.width=size==='desktop'?'100%':'390px'}
function input(label,key,val,type='text'){return '<div class="field"><label>'+label+'</label><input data-key="'+key+'" type="'+type+'" value="'+esc(val)+'"></div>'}
function area(label,key,val){return '<div class="field"><label>'+label+'</label><textarea data-key="'+key+'">'+esc(val)+'</textarea></div>'}
function settings(){let x=data.find(a=>a.id===selected);if(!x)return;$('settings').innerHTML='<h4>'+esc(x.name)+'</h4>'+input('Nama komponen','name',x.name)+input('Judul','title',x.title)+(x.type==='cover'?input('Nama mempelai pria','groom',x.groom)+input('Nama mempelai wanita','bride',x.bride)+input('Tanggal','date',x.date):'')+(x.type==='couple'||x.type==='event'||x.type==='location'||x.type==='gift'||x.type==='closing'?area('Deskripsi / informasi','text',x.text):'')+(x.type==='event'||x.type==='location'?area('Detail tambahan','detail',x.detail):'')+(x.type==='location'?input('Tautan Google Maps','maps',x.maps,'url'):'')+(x.type==='gift'?input('Nama bank','bank',x.bank)+input('Nomor rekening','account',x.account)+input('Nama pemilik','owner',x.owner):'')+'<div class="field"><label>Animasi (opsional)</label><select data-key="animation"><option value="none">Tanpa animasi</option><option value="fade-up">Fade Up</option><option value="fade-in">Fade In</option><option value="zoom-in">Zoom In</option><option value="slide-left">Slide Left</option><option value="slide-right">Slide Right</option></select></div><button class="btn danger" id="remove">Hapus komponen</button><p class="hint">Animasi disiapkan sebagai pengaturan opsional. Pengaturan dan data draft saat ini disimpan di browser perangkat ini.</p>';$('settings').querySelector('[data-key=animation]').value=x.animation||'none';$('settings').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{x[el.dataset.key]=el.value;preview();if(el.dataset.key==='name')list()});$('remove').onclick=()=>{if(confirm('Hapus komponen ini?')){data=data.filter(a=>a.id!==x.id);selected=data[0]?.id;render()}}}
function render(){list();settings();preview()}
$('add').onclick=()=>{let opts=['Cerita Cinta','Galeri Foto','RSVP Kehadiran','Detail Acara','Lokasi & Maps','Amplop Digital','Penutup'];let n=prompt('Tambah komponen:\n'+opts.map((v,i)=>(i+1)+'. '+v).join('\n'));if(!n||!opts[Number(n)-1])return;let title=opts[Number(n)-1],type=['story','gallery','rsvp','event','location','gift','closing'][Number(n)-1];let x={id:type+Date.now(),type,name:title,title,text:'Isi informasi di sini',detail:'',animation:'none'};data.push(x);selected=x.id;render()};
$('saveBtn').onclick=save;$('previewBtn').onclick=()=>{let w=window.open('','_blank');if(!w){notify('Izinkan pop-up untuk membuka preview');return}w.document.write('<meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview Undangan</title><style>body{margin:0;background:#eee}.invite{max-width:520px;margin:auto;background:white;min-height:100vh;text-align:center}.cover{height:80vh;background:linear-gradient(140deg,#c4a3af,#635365);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center}.cover h1{font:42px Georgia}.block,.end{padding:40px 24px;text-align:center}.block h2,.end h2{font:28px Georgia}.block p,.end p{line-height:1.8}.photo{height:160px;background:#eadde3;display:grid;place-items:center}.detail{background:#faf4f6;padding:20px}.end{background:#584653;color:white}</style><div class="invite">'+$('preview').innerHTML+'</div>');w.document.close()};
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{size=b.dataset.size;document.querySelectorAll('[data-size]').forEach(z=>z.classList.toggle('active',z===b));preview()});render();
</script></body></html>
